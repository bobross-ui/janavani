[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bhasha-test"
version = "0.1.0"
description = "Evaluation CLI for Janavani multilingual grievance extraction and redaction"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
bhasha-test = "bhasha_test.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../apps/api"]
testpaths = ["tests"]
