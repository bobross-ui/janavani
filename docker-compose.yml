services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: janavani
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/janavani
      REDIS_URL: redis://redis:6379/0
      AI_PROVIDER: ${AI_PROVIDER:-local}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_API_BASE: ${SARVAM_API_BASE:-https://api.sarvam.ai}
      SARVAM_STT_MODEL: ${SARVAM_STT_MODEL:-saarika:v2.5}
      SARVAM_STT_TRANSLATE_MODEL: ${SARVAM_STT_TRANSLATE_MODEL:-saaras:v2.5}
      SARVAM_TRANSLATE_MODEL: ${SARVAM_TRANSLATE_MODEL:-mayura:v1}
      SARVAM_TTS_MODEL: ${SARVAM_TTS_MODEL:-bulbul:v3}
      SARVAM_CHAT_MODEL: ${SARVAM_CHAT_MODEL:-sarvam-m}
      SARVAM_TIMEOUT_SECONDS: ${SARVAM_TIMEOUT_SECONDS:-30.0}
      SARVAM_MAX_RETRIES: ${SARVAM_MAX_RETRIES:-2}
      SARVAM_FALLBACK_ON_ERROR: ${SARVAM_FALLBACK_ON_ERROR:-true}
      ALLOW_PROVIDER_OVERRIDE: ${ALLOW_PROVIDER_OVERRIDE:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/janavani
      AI_PROVIDER: ${AI_PROVIDER:-local}
      JANAVANI_AUTOSEED: ${JANAVANI_AUTOSEED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ "$$JANAVANI_AUTOSEED" = "true" ]; then
          python -m app.seed
        else
          echo "Auto-seed disabled (JANAVANI_AUTOSEED != true)"
        fi

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
